<svg xmlns="http://www.w3.org/2000/svg" width="960" height="338" viewBox="0 0 960 338" role="img" aria-labelledby="title desc"><title id="title">rvCSI validation pipeline</title><desc id="desc">Nexmon and capture files enter CsiSource, validation, DSP and typed event emission. ESP32 file, serial and UDP are implemented; MCP and daemon remain planned.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#071524"/><stop offset="1" stop-color="#10142b"/></linearGradient><linearGradient id="line"><stop stop-color="#46e8c1"/><stop offset="1" stop-color="#70a7ff"/></linearGradient></defs><style>text{font-family:system-ui,-apple-system,Segoe UI,sans-serif;fill:#edf5ff}.muted{fill:#9aafc8}.label{font-size:14px;letter-spacing:2px;fill:#46e8c1}.flow{stroke-dasharray:7 12;animation:flow 3s linear infinite}.pulse{animation:pulse 4s ease-in-out infinite}.wave{animation:pulse 3s ease-in-out infinite}.ring{transform-box:fill-box;transform-origin:center;animation:ring 5s ease-out infinite}@keyframes flow{to{stroke-dashoffset:-76}}@keyframes pulse{50%{opacity:.35}}@keyframes ring{0%{transform:scale(.8);opacity:.6}100%{transform:scale(1.2);opacity:.08}}@media(prefers-reduced-motion:reduce){.flow,.pulse,.wave,.ring{animation:none!important}}</style><rect width="960" height="338" rx="20" fill="url(#bg)"/><rect x="1" y="1" width="958" height="336" rx="19" fill="none" stroke="#243854"/><text x="32" y="39" font-size="14" class="label">FROM CAPTURE TO CONFIDENCE</text><text x="32" y="77" font-size="28" class="">One runtime. A checkable signal path.</text><path class="flow" d="M236 166h28" stroke="#46e8c1" stroke-width="2"/><rect x="32" y="111" width="204" height="115" rx="12" fill="#102235" stroke="#29425f"/><text x="47" y="140" font-size="14" class="label">01 / INGEST</text><text x="47" y="174" font-size="18" class="">Nexmon + ESP32</text><text x="47" y="203" font-size="15" class="muted">CsiSource</text><path class="flow" d="M468 166h28" stroke="#46e8c1" stroke-width="2"/><rect x="264" y="111" width="204" height="115" rx="12" fill="#102235" stroke="#29425f"/><text x="279" y="140" font-size="14" class="label">02 / VALIDATE</text><text x="279" y="174" font-size="18" class="">Bounds + quality</text><text x="279" y="203" font-size="15" class="muted">CsiFrame</text><path class="flow" d="M700 166h28" stroke="#46e8c1" stroke-width="2"/><rect x="496" y="111" width="204" height="115" rx="12" fill="#102235" stroke="#29425f"/><text x="511" y="140" font-size="14" class="label">03 / PROCESS</text><text x="511" y="174" font-size="18" class="">Filters + features</text><text x="511" y="203" font-size="15" class="muted">SignalPipeline</text><rect x="728" y="111" width="204" height="115" rx="12" fill="#102235" stroke="#29425f"/><text x="743" y="140" font-size="14" class="label">04 / EMIT</text><text x="743" y="174" font-size="18" class="">Typed evidence</text><text x="743" y="203" font-size="15" class="muted">CsiEvent</text><text x="32" y="270" font-size="17" class="">Rust API</text><text x="208" y="270" font-size="17" class="">TypeScript via napi-rs</text><text x="510" y="270" font-size="17" class="">CLI capture + replay</text><text x="32" y="309" font-size="15" class="muted">ESP32: JSONL / serial / UDP. MCP server and daemon remain planned.</text></svg>
